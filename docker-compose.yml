services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notion_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notion_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notion_rag}
      POSTGRES_DB: ${POSTGRES_DB:-notion_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notion_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
